<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Delay — Moon Globe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="crt.css">
<style>
  .crt-scan.light { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px); }
  .hud.bl { left: 24px; bottom: 48px; font-size: 10px; }
  .lbl .n { display: block; color: rgba(93,255,138,.82); font-size: 9.5px; }
  .lbl.off .k { color: rgba(93,255,138,.6); }
  .hud .lost { color: #c8ffd2; }
  .brk { position: absolute; left: 0; top: 0; background: #000; color: #c8ffd2; font-size: 14px; line-height: 1; padding: 1px 4px; letter-spacing: -.08em; font-weight: 500; }
  @media (max-width: 600px) {
    .hud.tl { left: 18px; top: 18px; }
    .hud.tr { top: 64px; left: 18px; right: auto; text-align: left; }
    .hud.bl { top: 110px; bottom: auto; left: 18px; }
    .hud .title { font-size: 14px; }
    .lbl { font-size: 9.5px; letter-spacing: .1em; }
    .lbl .s, .lbl .n { font-size: 8.5px; }
  }
</style>
</head>
<body>
<three-d-stage name="signal-delay-moon-globe" crt background="#000"></three-d-stage>
<div class="labels glow" id="labels"></div>
<div class="hud tl glow">
  <div class="title">Signal Delay</div>
  <div class="dim">Moon · four selenographic targets</div>
</div>
<div class="hud tr glow">
  <div id="lvl">Level 3 · Targets</div>
  <div class="dim" id="link">Link · locked · 1.3 s</div>
</div>
<div class="hud bl dim">Not to scale · // Earth distance shortened</div>
<div class="crt-roll"></div><div class="crt-scan light"></div><div class="crt-vignette"></div>
<script src="three-d-stage.js"></script>
<script type="module">
import { buildMoonMap } from './moon-map.js';
import { buildEarthMaps } from './orbit-maps.js';
const LEVEL = Math.min(3, Math.max(1, parseInt(new URLSearchParams(location.search).get('level'), 10) || 3));
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const D = Math.PI / 180, TAU = Math.PI * 2, ADD = THREE.AdditiveBlending;
// 1 scene unit = 1 lunar radius (1,737.4 km)
const R_ORB = 1.14; // drawn orbit; true LRO altitude 50 km = 1.029

const canvasTex = (cv, name) => { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.name = name; return t; };
const moonMaps = buildMoonMap(1600, 800), earthMaps = buildEarthMaps(512, 256);
const T = { moon: canvasTex(moonMaps.map, 'moon_surface_map'), glow: canvasTex(moonMaps.glow, 'moon_earthshine_map'), earth: canvasTex(earthMaps.surface, 'earth_surface_map'), clouds: canvasTex(earthMaps.clouds, 'earth_clouds_map') };

const M = {
  surface: new THREE.MeshStandardMaterial({ name: 'moon_regolith', map: T.moon, emissive: 0xffffff, emissiveMap: T.glow, emissiveIntensity: 1, roughness: 1, metalness: 0 }),
  earth: new THREE.MeshStandardMaterial({ name: 'earth_surface', map: T.earth, emissive: 0x0b2a5c, emissiveIntensity: 0.6, roughness: 0.8, metalness: 0 }),
  clouds: new THREE.MeshStandardMaterial({ name: 'earth_clouds', map: T.clouds, transparent: true, depthWrite: false, roughness: 1, metalness: 0 }),
  grid: new THREE.LineBasicMaterial({ name: 'graticule', color: 0x2f9a4c, transparent: true, opacity: 0.3, blending: ADD, depthWrite: false }),
  beam: new THREE.MeshBasicMaterial({ name: 'orbit_beam', color: 0x55ff84 }),
  hot: new THREE.MeshBasicMaterial({ name: 'phosphor_hot', color: 0xe0ffe4 }),
  marker: new THREE.MeshBasicMaterial({ name: 'target_marker', color: 0xc8ffd2, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }),
  pulse: new THREE.MeshBasicMaterial({ name: 'target_pulse', color: 0x5dff8a, side: THREE.DoubleSide, transparent: true, opacity: 0.55, blending: ADD, depthWrite: false }),
  line: new THREE.LineBasicMaterial({ name: 'phosphor_line', color: 0x8dffa8, transparent: true, blending: ADD }),
  far: new THREE.LineDashedMaterial({ name: 'orbit_far_dashed', color: 0x2a9a4a, dashSize: 0.04, gapSize: 0.035, transparent: true, opacity: 0.8, blending: ADD, depthTest: false }),
  sigOff: new THREE.LineDashedMaterial({ name: 'signal_broken', color: 0x2a9a4a, dashSize: 0.06, gapSize: 0.06, transparent: true, opacity: 0.7, blending: ADD }),
};

const ll = (lat, lon, r = 1) => new THREE.Vector3(r * Math.cos(lat * D) * Math.cos(lon * D), r * Math.sin(lat * D), -r * Math.cos(lat * D) * Math.sin(lon * D));
const segs = (pts, mat, name) => { const l = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), mat); l.name = name; return l; };

// Body frame: +x = sub-Earth point (0°, 0°). Tidally locked, so no spin relative to Earth.
const root = new THREE.Group(); root.name = 'moon_system';
const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 112), M.surface); globe.name = 'moon_surface';
root.add(globe);
{
  const p = [], r = 1.004, n = 96;
  for (let lat = -60; lat <= 60; lat += 30) for (let k = 0; k < n; k++) p.push(ll(lat, k / n * 360, r), ll(lat, (k + 1) / n * 360, r));
  for (let lon = 0; lon < 360; lon += 30) for (let k = 0; k < n / 2; k++) p.push(ll(-90 + k / (n / 2) * 180, lon, r), ll(-90 + (k + 1) / (n / 2) * 180, lon, r));
  root.add(segs(p, M.grid, 'graticule'));
}

// Earth — fixed over the near side
const earthG = new THREE.Group(); earthG.name = 'earth';
const earthTilt = new THREE.Group(); earthTilt.rotation.z = 23.44 * D;
const earthBody = new THREE.Mesh(new THREE.SphereGeometry(0.085, 48, 32), M.earth); earthBody.name = 'earth_surface';
const clouds = new THREE.Mesh(new THREE.SphereGeometry(0.087, 48, 32), M.clouds); clouds.name = 'earth_clouds';
earthTilt.add(earthBody, clouds); earthG.add(earthTilt); root.add(earthG);
const earthMark = new THREE.Group(); earthMark.name = 'earth_brackets';
{
  const s = 0.15, L = 0.045, p = [];
  for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) p.push(new THREE.Vector3(sx * s, sy * s, 0), new THREE.Vector3(sx * (s - L), sy * s, 0), new THREE.Vector3(sx * s, sy * s, 0), new THREE.Vector3(sx * s, sy * (s - L), 0));
  earthMark.add(segs(p, M.line, 'earth_brackets_lines'));
}
earthG.add(earthMark);

// Polar orbit in the plane containing the pole (y) and Earth (x): near half solid, far half dashed
const orbit = new THREE.Group(); orbit.name = 'orbiter_orbit';
orbit.rotation.y = 30 * D; // polar plane through 30°E / 150°W
const nearArc = new THREE.Mesh(new THREE.TorusGeometry(R_ORB, 0.0055, 8, 240, Math.PI), M.beam);
nearArc.name = 'orbit_near_side'; nearArc.rotation.z = -Math.PI / 2;
const farPts = []; for (let k = 0; k <= 160; k++) { const a = Math.PI / 2 + k / 160 * Math.PI; farPts.push(new THREE.Vector3(R_ORB * Math.cos(a), R_ORB * Math.sin(a), 0)); }
const farArc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(farPts), M.far); farArc.computeLineDistances(); farArc.name = 'orbit_far_side'; farArc.renderOrder = 2;
const trail = new THREE.Mesh(new THREE.TorusGeometry(R_ORB, 0.011, 8, 120, 0.9), M.hot); trail.name = 'orbiter_trail';
const orbiter = new THREE.Group(); orbiter.name = 'orbiter';
const orbBody = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(0.034)), M.line); orbBody.name = 'orbiter_marker';
orbiter.add(orbBody);
orbit.add(nearArc, farArc, trail, orbiter);
root.add(orbit);

// signal line Earth ↔ orbiter
const mkLine = (mat, name) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3)); const l = new THREE.Line(g, mat); l.name = name; l.frustumCulled = false; return l; };
const sigOn = mkLine(M.line, 'signal_link'), sigOff = mkLine(M.sigOff, 'signal_broken');
root.add(sigOn, sigOff);

// station-keeping tag on the ring
const SK_A = 38 * D;
const skAnchor = new THREE.Object3D();
if (LEVEL >= 2) {
  const g = new THREE.Group(); g.name = 'station_keeping_tag';
  const rd = a => new THREE.Vector3(Math.cos(a), Math.sin(a), 0), p = [];
  for (const da of [-4 * D, 4 * D]) p.push(rd(SK_A + da).multiplyScalar(R_ORB - 0.035), rd(SK_A + da).multiplyScalar(R_ORB + 0.035));
  p.push(rd(SK_A).multiplyScalar(R_ORB + 0.02), rd(SK_A).multiplyScalar(R_ORB + 0.2));
  const arc = []; for (let k = 0; k < 16; k++) { arc.push(rd(SK_A - 4 * D + k / 16 * 8 * D).multiplyScalar(R_ORB + 0.035), rd(SK_A - 4 * D + (k + 1) / 16 * 8 * D).multiplyScalar(R_ORB + 0.035)); }
  g.add(segs(p.concat(arc), M.line, 'station_keeping_ticks'));
  skAnchor.position.copy(rd(SK_A).multiplyScalar(R_ORB + 0.2));
  g.add(skAnchor); orbit.add(g);
}
const farAnchor = new THREE.Object3D(); farAnchor.position.set(R_ORB * Math.cos(125 * D), R_ORB * Math.sin(125 * D), 0); orbit.add(farAnchor);

// targets
const TARGETS = [
  { id: 'T1', name: 'Apollo 11 Site', lat: 0.67, lon: 23.47, ring: 0.03, lines: ['0.7°N 23.5°E', 'Near side · direct link'] },
  { id: 'T2', name: 'Tycho Crater', lat: -43.3, lon: -11.2, ring: 0.042, lines: ['43.3°S 11.2°W', 'Bright rays'] },
  { id: 'T3', name: 'Shackleton Crater', lat: -89.9, lon: 0, ring: 0.04, lines: ['89.9°S · South pole', 'Rim lit · floor in permanent shadow', 'Water ice?'] },
  { id: 'T4', name: 'Tsiolkovskiy Crater', lat: -20.4, lon: 129.1, ring: 0.06, lines: ['20.4°S 129.1°E · Far side', 'No signal while observing'] },
];
const markers = [];
if (LEVEL >= 3) for (const t of TARGETS) {
  const g = new THREE.Group(); g.name = 'target_' + t.name.toLowerCase().replace(/\s+/g, '_');
  const n = ll(t.lat, t.lon), base = n.clone().multiplyScalar(1.006);
  g.position.copy(base); g.lookAt(base.clone().multiplyScalar(2));
  const ring = new THREE.Mesh(new THREE.RingGeometry(t.ring, t.ring + 0.006, 72), M.marker); ring.name = g.name + '_ring';
  const pulse = new THREE.Mesh(new THREE.RingGeometry(t.ring, t.ring + 0.004, 72), M.pulse); pulse.name = g.name + '_pulse';
  const s = t.ring, ticks = [];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) ticks.push(new THREE.Vector3(dx * s * 1.25, dy * s * 1.25, 0), new THREE.Vector3(dx * s * 1.65, dy * s * 1.65, 0));
  const pinLen = 0.1;
  ticks.push(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, pinLen));
  const tip = new THREE.Object3D(); tip.position.set(0, 0, pinLen);
  g.add(ring, pulse, segs(ticks, M.line, g.name + '_reticle'), tip);
  root.add(g);
  markers.push({ ...t, group: g, pulse, tip });
}

// lights — sun near the lunar equator (1.5° obliquity), so the pole sees grazing light
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
stage.scene.add(sun, new THREE.AmbientLight(0xffffff, 0.04));

// labels
const labelsEl = document.getElementById('labels');
const mk = (k, lines = [], cls = '') => {
  const el = document.createElement('div'); el.className = 'lbl ' + cls;
  el.innerHTML = `<span class="k">${k}</span>` + lines.map((s, i) => `<span class="${i ? 'n' : 's'}">${s}</span>`).join('');
  labelsEl.appendChild(el); return el;
};
markers.forEach(m => (m.el = mk(`${m.id} ${m.name}`, m.lines)));
const earthLabel = mk('Earth · 384,400 km · 1.3 s', ['Always sees the near side']);
const orbLabel = mk('Orbiter · Alt 50 km · Polar', ['Link · 1.3 s']);
const orbSub = orbLabel.querySelector('.s');
const farLabel = mk('No signal — behind the Moon', ['≈48 of every 113 min'], 'off');
const skLabel = LEVEL >= 2 ? mk('Station-keeping', ['Mascons perturb low orbits', 'Trim burns hold 50 km']) : null;
document.getElementById('lvl').textContent = ['Level 1 · Globe & orbit', 'Level 2 · Station-keeping', 'Level 3 · Four targets'][LEVEL - 1];
const linkEl = document.getElementById('link');

const V = new THREE.Vector3(), W = new THREE.Vector3(), C = new THREE.Vector3();
// Labels: each tries candidate spots around its anchor (preferred first) and takes the first
// that clears every label/marker already placed this frame.
let placed = [];
const proj = p => { V.copy(p).project(stage.camera); return { x: (V.x * 0.5 + 0.5) * stage.clientWidth, y: (-V.y * 0.5 + 0.5) * stage.clientHeight, ok: V.z < 1 }; };
const block = (s, r) => placed.push({ x: s.x - r, y: s.y - r, w: 2 * r, h: 2 * r });
const hits = (x, y, w, h) => placed.some(q => x < q.x + q.w + 8 && x + w + 8 > q.x && y < q.y + q.h + 5 && y + h + 5 > q.y);
// HUD blocks (top-left/right + not-to-scale note) count as obstacles
const hudRects = () => [...document.querySelectorAll('.hud')].map(e => { const r = e.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; });
const toScreen = (p, el, dx, dy, o) => {
  const s = proj(p), op = s.ok ? o : 0, w = el.offsetWidth, hh = el.offsetHeight, SW = stage.clientWidth, SH = stage.clientHeight;
  const cx = v => Math.min(SW - w - 12, Math.max(12, v)), cy = v => Math.min(SH - hh - 70, Math.max(70, v));
  const cands = [];
  for (const k of [1, 2.2, 3.6, 5.2]) {
    const ex = dx * k, up = dy - (k - 1) * 18, dn = 8 + (k - 1) * 18;
    cands.push([s.x + ex, s.y + up], [s.x + ex, s.y + dn], [s.x - ex - w, s.y + up], [s.x - ex - w, s.y + dn], [s.x - w / 2, s.y + 16 * k], [s.x - w / 2, s.y - hh - 16 * k]);
  }
  for (const c of cands) { c[0] = cx(c[0]); c[1] = cy(c[1]); }
  let [lx, ly] = cands[0];
  if (op > 0.05) {
    // least total overlap wins; ties keep the preferred (earlier) spot
    let best = Infinity;
    for (const [x0, y0] of cands) {
      let ov = 0;
      for (const q of placed) { const ox = Math.min(x0 + w + 8, q.x + q.w + 8) - Math.max(x0, q.x), oy = Math.min(y0 + hh + 5, q.y + q.h + 5) - Math.max(y0, q.y); if (ox > 0 && oy > 0) ov += ox * oy; }
      ov += Math.hypot(x0 - cands[0][0], y0 - cands[0][1]) * 0.01;
      if (ov < best) { best = ov; lx = x0; ly = y0; }
    }
    // still overlapping: nearest free slot scanning columns left/right of the anchor
    if (best >= 1) {
      let bd = Infinity;
      for (const x0 of [cx(s.x + dx), cx(s.x - dx - w), cx(s.x - w / 2), 12, SW - w - 12])
        for (let y0 = 70; y0 <= SH - hh - 70; y0 += 4)
          if (!hits(x0, y0, w, hh)) { const dd = Math.hypot(x0 - s.x, y0 - s.y); if (dd < bd) { bd = dd; lx = x0; ly = y0; } }
    }
    placed.push({ x: lx, y: ly, w, h: hh });
  }
  el.style.transform = `translate(${lx.toFixed(1)}px, ${ly.toFixed(1)}px)`;
  el.style.opacity = op;
};
// distance break mark on the signal line
const brk = document.createElement('div'); brk.className = 'brk'; brk.textContent = '//'; labelsEl.appendChild(brk);
const BRK_T = 0.34;
const occluded = p => { const c = stage.camera.position, d = W.copy(p).sub(c), len = d.length(); d.divideScalar(len); const t = -c.dot(d); return t > 0 && t < len && C.copy(c).addScaledVector(d, t).length() < 1; };
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const PERIOD = 22, E = new THREE.Vector3(), O = new THREE.Vector3(), B = new THREE.Vector3();
let linked = null;
function setLine(line, a, b) { const p = line.geometry.attributes.position; p.setXYZ(0, a.x, a.y, a.z); p.setXYZ(1, b.x, b.y, b.z); p.needsUpdate = true; line.geometry.computeBoundingSphere(); }
function update(dt, el) {
  const phi = (el * TAU / PERIOD + 0.35) % TAU;
  orbiter.position.set(R_ORB * Math.cos(phi), R_ORB * Math.sin(phi), 0);
  orbBody.rotation.set(el, el * 1.3, 0);
  trail.rotation.z = phi - 0.9;
  earthBody.rotation.y += dt * 0.25; clouds.rotation.y += dt * 0.3;
  markers.forEach((m, i) => { const k = ((el * 0.5 + i * 0.27) % 1); m.pulse.scale.setScalar(1 + k * 0.9); });

  // line of sight: on the far half the Moon blocks Earth
  const now = Math.cos(phi) > 0; // near-side half (x > 0)
  E.copy(earthG.position); O.copy(orbiter.position).applyEuler(orbit.rotation);
  if (now) { setLine(sigOn, E, O); }
  else {
    B.copy(O).sub(E); const a = B.dot(B), b = 2 * E.dot(B), c = E.dot(E) - 1, disc = b * b - 4 * a * c;
    const t = disc > 0 ? Math.max(BRK_T + 0.12, (-b - Math.sqrt(disc)) / (2 * a) - 0.04) : 0.55;
    setLine(sigOff, E, B.multiplyScalar(t).add(E)); sigOff.computeLineDistances();
  }
  if (now !== linked) {
    linked = now; sigOn.visible = now; sigOff.visible = !now;
    orbSub.textContent = now ? 'Link · 1.3 s' : 'No signal'; orbLabel.classList.toggle('off', !now);
    linkEl.textContent = now ? 'Link · locked · 1.3 s' : 'Link · lost · far side';
    linkEl.classList.toggle('lost', !now);
  }

  root.updateMatrixWorld(true);
  const cam = stage.camera.position;
  placed = hudRects();
  // obstacles first: Earth disc, break mark, target reticles, orbiter
  earthG.getWorldPosition(W); earthMark.quaternion.copy(root.quaternion).invert().multiply(stage.camera.quaternion);
  const eS = proj(W), eW = W.clone(); block(eS, 22);
  orbiter.getWorldPosition(W); const oS = proj(W), oW = W.clone(), oVis = !occluded(W); if (oVis) block(oS, 12);
  {
    const a = proj(root.localToWorld(E.clone())), b = proj(root.localToWorld(E.clone().lerp(O, 1)));
    const m = { x: a.x + (b.x - a.x) * BRK_T, y: a.y + (b.y - a.y) * BRK_T };
    let ang = Math.atan2(b.y - a.y, b.x - a.x); if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
    brk.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px) translate(-50%, -50%) rotate(${ang.toFixed(3)}rad)`;
    block(m, 10);
  }
  for (const m of markers) { m.group.getWorldPosition(W); const n = W.clone().normalize(); m.facing = n.dot(C.copy(cam).sub(W).normalize()); if (m.facing > 0.05) block(proj(W), 14); }
  toScreen(eW, earthLabel, 20, -14, occluded(eW) ? 0 : 1);
  if (skLabel) { skAnchor.getWorldPosition(W); toScreen(W.clone(), skLabel, 10, -12, occluded(W) ? 0 : 1); }
  farAnchor.getWorldPosition(W);
  toScreen(W.clone(), farLabel, 14, 4, 1);
  for (const m of markers) { m.tip.getWorldPosition(W); toScreen(W.clone(), m.el, 10, -26, ss(0.05, 0.25, m.facing)); }
  toScreen(oW, orbLabel, 16, 6, oVis ? 1 : 0);
}

// camera from the south-east: sees Apollo 11, Tycho, Shackleton and Tsiolkovskiy at once
const CAM = ll(-38, 72);
const frame = () => {
  const asp = ((stage.clientWidth || innerWidth) / (stage.clientHeight || innerHeight)) || 16 / 9, mob = asp < 0.9;
  earthG.position.set(mob ? 3.3 : 4.2, 0, 0);
  root.quaternion.setFromAxisAngle(CAM, mob ? -1.05 : -0.18);
  root.updateMatrixWorld(true);
  const e = earthG.getWorldPosition(new THREE.Vector3());
  const center = e.multiplyScalar(mob ? 0.4 : 0.38);
  stage.frame({ dir: CAM.toArray(), radius: mob ? Math.max(3.3, 1.5 / asp) : Math.max(1.75, 3.2 / asp), center: center.toArray() });
  sun.position.copy(ll(1.5, -35, 6)).applyQuaternion(root.quaternion);
};
update(0, 0);
stage.setObject(root);
frame(); new ResizeObserver(frame).observe(stage);
stage.onFrame = update;
