<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Delay — Mars Globe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="crt.css">
</head>
<body>
<three-d-stage name="signal-delay-mars-globe" crt background="#000"></three-d-stage>
<div class="labels glow" id="labels"></div>
<div class="hud tl glow">
  <div class="title">Signal Delay</div>
  <div class="dim" id="sub">Mars · building surface map…</div>
</div>
<div class="crt-roll"></div><div class="crt-scan"></div><div class="crt-vignette"></div>
<script src="three-d-stage.js"></script>
<script type="module">
import { buildMarsMap } from './mars-map.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const D = Math.PI / 180, TAU = Math.PI * 2, ADD = THREE.AdditiveBlending;
// 1 scene unit = 1 Mars radius (3,389.5 km)
const KM = 3389.5;

const tex = new THREE.CanvasTexture(buildMarsMap(1600, 800));
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
tex.name = 'mars_surface_map';

const M = {
  surface: new THREE.MeshStandardMaterial({ name: 'mars_surface', map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.14, roughness: 1, metalness: 0 }),
  grid: new THREE.LineBasicMaterial({ name: 'graticule', color: 0x2f9a4c, transparent: true, opacity: 0.32, blending: ADD, depthWrite: false }),
  beam: new THREE.MeshBasicMaterial({ name: 'orbit_beam', color: 0x55ff84 }),
  hot: new THREE.MeshBasicMaterial({ name: 'phosphor_hot', color: 0xe0ffe4 }),
  marker: new THREE.MeshBasicMaterial({ name: 'target_marker', color: 0xc8ffd2, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }),
  pulse: new THREE.MeshBasicMaterial({ name: 'target_pulse', color: 0x5dff8a, side: THREE.DoubleSide, transparent: true, opacity: 0.55, blending: ADD, depthWrite: false }),
  line: new THREE.LineBasicMaterial({ name: 'phosphor_line', color: 0x8dffa8, transparent: true, blending: ADD }),
  dim: new THREE.LineBasicMaterial({ name: 'phosphor_dim', color: 0x2a9a4a, transparent: true, opacity: 0.75, blending: ADD }),
  phobos: new THREE.MeshStandardMaterial({ name: 'phobos_regolith', color: 0x58c070, emissive: 0x0d3318, roughness: 1, metalness: 0 }),
};

const ll = (lat, lon, r = 1) => new THREE.Vector3(r * Math.cos(lat * D) * Math.cos(lon * D), r * Math.sin(lat * D), -r * Math.cos(lat * D) * Math.sin(lon * D));
const segs = (pts, mat, name) => { const l = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), mat); l.name = name; return l; };

const root = new THREE.Group(); root.name = 'mars_system';
const axis = new THREE.Group(); axis.name = 'mars_axis';
axis.rotation.set(0.28, 0, -0.32);
const body = new THREE.Group(); body.name = 'mars_body';
body.rotation.y = 30 * D;
root.add(axis); axis.add(body);

const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 112), M.surface); globe.name = 'mars_surface';
body.add(globe);

// graticule, 30° spacing
{
  const p = [], r = 1.004, n = 96;
  for (let lat = -60; lat <= 60; lat += 30) for (let k = 0; k < n; k++) p.push(ll(lat, k / n * 360, r), ll(lat, (k + 1) / n * 360, r));
  for (let lon = 0; lon < 360; lon += 30) for (let k = 0; k < n / 2; k++) p.push(ll(-90 + k / (n / 2) * 180, lon, r), ll(-90 + (k + 1) / (n / 2) * 180, lon, r));
  body.add(segs(p, M.grid, 'graticule'));
}

// surface targets
const TARGETS = [
  { id: 'T1', name: 'Olympus Mons', lat: 18.65, lon: -133.8, ring: 0.11, sub: '18.6°N 133.8°W' },
  { id: 'T2', name: 'Valles Marineris', lat: -13.9, lon: -59.2, ring: 0.12, sub: '13.9°S 59.2°W' },
  { id: 'T3', name: 'Jezero Crater', lat: 18.38, lon: 77.58, ring: 0.045, sub: '18.4°N 77.6°E' },
  { id: 'T4', name: 'North Polar Cap', lat: 90, lon: 0, ring: 0.17, sub: '90°N · Planum Boreum' },
];
const markers = [];
for (const t of TARGETS) {
  const g = new THREE.Group(); g.name = 'target_' + t.name.toLowerCase().replace(/\s+/g, '_');
  const n = ll(t.lat, t.lon), base = n.clone().multiplyScalar(1.006);
  g.position.copy(base); g.lookAt(base.clone().multiplyScalar(2));
  const ring = new THREE.Mesh(new THREE.RingGeometry(t.ring, t.ring + 0.009, 72), M.marker); ring.name = g.name + '_ring';
  const pulse = new THREE.Mesh(new THREE.RingGeometry(t.ring, t.ring + 0.006, 72), M.pulse); pulse.name = g.name + '_pulse';
  const s = t.ring, ticks = [];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) ticks.push(new THREE.Vector3(dx * s * 1.25, dy * s * 1.25, 0), new THREE.Vector3(dx * s * 1.6, dy * s * 1.6, 0));
  const pinLen = 0.22;
  ticks.push(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, pinLen));
  const tip = new THREE.Object3D(); tip.name = g.name + '_anchor'; tip.position.set(0, 0, pinLen);
  g.add(ring, pulse, segs(ticks, M.line, g.name + '_reticle'), tip);
  body.add(g);
  markers.push({ ...t, group: g, pulse, tip, normal: n });
}

// Phobos — equatorial, 9,376 km
const PH_R = 9376 / KM;
const phobosOrbit = new THREE.Mesh(new THREE.TorusGeometry(PH_R, 0.0035, 6, 360), M.beam);
phobosOrbit.name = 'phobos_orbit'; phobosOrbit.rotation.x = Math.PI / 2;
const phobosPivot = new THREE.Group(); phobosPivot.name = 'phobos_pivot';
let phobos;
{
  const g = new THREE.SphereGeometry(0.075, 40, 28), pos = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 1 + 0.08 * Math.sin(v.x * 70) * Math.sin(v.y * 55 + 1) + 0.06 * Math.sin(v.z * 90 + 2);
    v.multiplyScalar(n); v.x *= 1.25; v.z *= 0.85; pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  phobos = new THREE.Mesh(g, M.phobos); phobos.name = 'phobos';
  phobos.position.set(PH_R, 0, 0);
}
phobosPivot.add(phobos);
axis.add(phobosOrbit, phobosPivot);
const phobosMark = new THREE.Group(); phobosMark.name = 'target_phobos';
{
  const s = 0.16, L = 0.06, p = [];
  for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) p.push(new THREE.Vector3(sx * s, sy * s, 0), new THREE.Vector3(sx * (s - L), sy * s, 0), new THREE.Vector3(sx * s, sy * s, 0), new THREE.Vector3(sx * s, sy * (s - L), 0));
  phobosMark.add(segs(p, M.line, 'target_phobos_brackets'));
}
root.add(phobosMark);

// robot orbiter — inclined orbit
const ROB_R = 1.42;
const robotOrbit = new THREE.Group(); robotOrbit.name = 'robot_orbit';
robotOrbit.rotation.set(-1.22, 0, 0.42);
const ring = new THREE.Mesh(new THREE.TorusGeometry(ROB_R, 0.0055, 8, 400), M.beam); ring.name = 'robot_orbit_ring';
const trail = new THREE.Mesh(new THREE.TorusGeometry(ROB_R, 0.011, 8, 120, 1.1), M.hot); trail.name = 'robot_orbit_trail';
const robot = new THREE.Group(); robot.name = 'robot';
const robotBody = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(0.045)), M.line); robotBody.name = 'robot_marker';
robot.add(robotBody);
robotOrbit.add(ring, trail, robot);
axis.add(robotOrbit);

// lights live on the stage scene, not in the export
const sun = new THREE.DirectionalLight(0xffffff, 3.4); sun.position.set(-4, 1.6, 3.2);
stage.scene.add(sun, new THREE.AmbientLight(0xffffff, 0.12));

// labels
const labelsEl = document.getElementById('labels');
const mk = (k, s) => { const el = document.createElement('div'); el.className = 'lbl'; el.innerHTML = `<span class="k">${k}</span><span class="s">${s}</span>`; labelsEl.appendChild(el); return el; };
markers.forEach(m => (m.el = mk(`${m.id} ${m.name}`, m.sub)));
const phLabel = mk('T5 Phobos', '9,376 km · 7h 39m');
const robLabel = mk('Orbiter', `Alt ${Math.round((ROB_R - 1) * KM).toLocaleString('en-US')} km`);
const V = new THREE.Vector3(), W = new THREE.Vector3(), C = new THREE.Vector3();
const toScreen = (p, el, dx, dy, o) => {
  V.copy(p).project(stage.camera);
  const x = (V.x * 0.5 + 0.5) * stage.clientWidth, y = (-V.y * 0.5 + 0.5) * stage.clientHeight;
  if (x + dx + el.offsetWidth > stage.clientWidth - 16) dx = -dx - el.offsetWidth;
  const lx = Math.min(stage.clientWidth - el.offsetWidth - 12, Math.max(12, x + dx));
  el.style.transform = `translate(${lx.toFixed(1)}px, ${(y + dy).toFixed(1)}px)`;
  el.style.opacity = V.z < 1 ? o : 0;
};
const occluded = p => { const c = stage.camera.position, d = W.copy(p).sub(c), len = d.length(); d.divideScalar(len); const t = -c.dot(d); return t > 0 && t < len && C.copy(c).addScaledVector(d, t).length() < 1; };
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const SPIN = TAU / 90, PH_W = SPIN * (24.62 / 7.65), ROB_W = TAU / 16;
function update(dt, el) {
  body.rotation.y += SPIN * dt;
  phobosPivot.rotation.y += PH_W * dt;
  phobos.rotation.y = -phobosPivot.rotation.y;
  const ra = (el * ROB_W) % TAU;
  robot.position.set(ROB_R * Math.cos(ra), ROB_R * Math.sin(ra), 0);
  robotBody.rotation.set(el, el * 1.3, 0);
  trail.rotation.z = ra - 1.1;
  markers.forEach((m, i) => { const k = ((el * 0.5 + i * 0.27) % 1); m.pulse.scale.setScalar(1 + k * 0.9); });
  root.updateMatrixWorld(true);
  const cam = stage.camera.position;
  for (const m of markers) {
    m.group.getWorldPosition(W); const n = W.clone().normalize();
    const facing = n.dot(C.copy(cam).sub(W).normalize());
    m.tip.getWorldPosition(V);
    toScreen(V.clone(), m.el, 10, -26, ss(0.05, 0.25, facing));
  }
  phobos.getWorldPosition(W); phobosMark.position.copy(W); phobosMark.quaternion.copy(stage.camera.quaternion);
  toScreen(W.clone(), phLabel, 22, -40, occluded(W) ? 0 : 1);
  phobosMark.visible = !occluded(W);
  robot.getWorldPosition(W);
  toScreen(W.clone(), robLabel, 16, 6, occluded(W) ? 0 : 1);
}
update(0, 0);
stage.setObject(root);
const frame = () => {
  const asp = ((stage.clientWidth || innerWidth) / (stage.clientHeight || innerHeight)) || 16 / 9;
  stage.frame({ dir: [0.08, 0.22, 1], radius: Math.max(1.8, 3.15 / asp) });
};
frame(); new ResizeObserver(frame).observe(stage);
stage.onFrame = update;
document.getElementById('sub').textContent = 'Mars · five areographic targets';
</script>
</body>
</html>
