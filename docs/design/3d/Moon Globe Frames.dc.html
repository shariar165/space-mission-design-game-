<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body { margin: 0; background: #050605; } a { color: #5dff8a; text-decoration: none; } a:hover { color: #c8ffd2; }</style>
</helmet>
<section id="1" data-screen-label="Moon Globe states" style="display: flex; flex-direction: column; gap: 72px; padding: 80px; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #5dff8a; text-transform: uppercase; letter-spacing: .14em;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 22px; letter-spacing: .22em; color: #b6ffc4;">Signal Delay · Moon Globe</div>
    <div style="font-size: 13px; color: #3fae5e;">Three states · desktop 1440 + mobile 390 · each frame is live — drag to orbit, scroll to zoom</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 13px; color: #3fae5e;">Desktop · 1440 × 900</div>
    <div style="display: flex; gap: 48px; align-items: flex-start;">
      <div id="1a" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">a</span><span>Level 1 · Globe & orbit, night side shaded</span></div>
        <iframe src="Moon Globe.html?level=1" title="Moon Globe level 1 desktop" style="width: 1440px; height: 900px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
      <div id="1b" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">b</span><span>Level 2 · Station-keeping tag</span></div>
        <iframe src="Moon Globe.html?level=2" title="Moon Globe level 2 desktop" style="width: 1440px; height: 900px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
      <div id="1c" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">c</span><span>Level 3 · Four targets</span></div>
        <iframe src="Moon Globe.html?level=3" title="Moon Globe level 3 desktop" style="width: 1440px; height: 900px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 13px; color: #3fae5e;">Mobile · 390 × 844</div>
    <div style="display: flex; gap: 48px; align-items: flex-start;">
      <div id="1d" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">a</span><span>Level 1</span></div>
        <iframe src="Moon Globe.html?level=1" title="Moon Globe level 1 mobile" style="width: 390px; height: 844px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
      <div id="1e" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">b</span><span>Level 2</span></div>
        <iframe src="Moon Globe.html?level=2" title="Moon Globe level 2 mobile" style="width: 390px; height: 844px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
      <div id="1f" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; gap: 14px; align-items: center; font-size: 14px;"><span style="border: 1px solid #5dff8a; padding: 4px 10px; color: #c8ffd2;">c</span><span>Level 3</span></div>
        <iframe src="Moon Globe.html?level=3" title="Moon Globe level 3 mobile" style="width: 390px; height: 844px; border: 1px solid #1d5a2e; background: #000; display: block;"></iframe>
      </div>
    </div>
  </div>
</section>
</x-dc>

</html>
