# Record NASA DONKI responses (FLR, CME, SEP from the CCMC DONKI-API) as test fixtures, by hand only. The recording
# goes on a new branch and arrives as a pull request; nothing is pushed to main. The daily snapshot the game reads is
# not made here: pages.yml fetches it in the deploy build.
# A pull request opened with the workflow token does not start other workflows, so this run starts CI on the branch
# itself (workflow_dispatch is allowed), and the PR gets its "Typecheck and tests" result.
name: DONKI fixtures

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First day of the week to record (YYYY-MM-DD)
        default: '2024-05-08'
        required: true
      end_date:
        description: Last day (YYYY-MM-DD; CCMC refuses ranges over 30 days)
        default: '2024-05-14'
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: donki-fixtures
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      START: ${{ inputs.start_date }}
      END: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Record the responses
        run: node scripts/fetch-donki.mjs --fixtures "$START" "$END"
      - name: Open a pull request
        run: |
          git add tests/fixtures/donki
          if git diff --cached --quiet; then
            echo "The recorded responses are unchanged: no pull request."
            exit 0
          fi
          branch="donki-fixtures/${START}_${END}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "test: record DONKI fixtures ${START} → ${END}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Record DONKI fixtures ${START} → ${END}" \
            --body "Raw CCMC DONKI-API responses (FLR, CME, SEP) for ${START} → ${END}, recorded by the DONKI fixtures workflow (run ${GITHUB_RUN_ID}). See tests/fixtures/donki/recorded.json for URLs, HTTP status and fetch time."
          gh workflow run ci.yml --ref "$branch"
